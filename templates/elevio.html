<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=block" rel="stylesheet">
<!--
  Template da Elevio para carrossel (1080x1350) e story (1080x1920).
  Não editar por post: o conteúdo vem do conteudo.json de cada post, via render.mjs.
  Tipos de slide: capa, item, lista, comparativo, cta, story, story-cta.
  Destaque em gradiente: envolver o trecho com *asteriscos*.
-->
<style>
:root{--bg:#070b16;--cyan:#22d3ee;--blue:#4f6cf5;--purple:#7c3aed;--text:#eef1f8;--muted:#9aa3b8;--line:#232d48}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Manrope,Inter,sans-serif;color:var(--text);background:#000}
.s{position:relative;width:1080px;height:1350px;overflow:hidden;margin-bottom:20px;
  background:radial-gradient(800px 650px at 25% 12%,#16214a 0%,transparent 70%),radial-gradient(700px 700px at 95% 95%,#22124a 0%,transparent 70%),var(--bg)}
.story .s{height:1920px}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:90px 90px}
.hdr{position:absolute;left:88px;right:88px;top:96px;display:flex;justify-content:space-between;align-items:center}
.story .hdr{top:150px}
.logo{display:flex;align-items:center;gap:16px;font-size:40px;font-weight:700}
.pg{font-size:26px;font-weight:700;letter-spacing:1px}.pg span{color:#7e879f}
.grad{background:linear-gradient(90deg,var(--cyan),var(--blue) 55%,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.body{position:absolute;left:88px;right:88px;top:250px;bottom:230px;display:flex;flex-direction:column;justify-content:center;gap:40px}
.story .body{top:320px;bottom:360px}
.kicker{display:flex;align-items:center;gap:14px;color:var(--cyan);font-size:32px;font-weight:700}
h1{font-size:104px;line-height:1.02;font-weight:800;letter-spacing:-3px}
h2{font-size:70px;line-height:1.08;font-weight:800;letter-spacing:-1.5px}
.d{font-size:38px;line-height:1.4;color:var(--muted);font-weight:500}
.num{font-size:150px;font-weight:800;line-height:1;letter-spacing:-4px}
.bars{position:absolute;right:-40px;bottom:-30px;width:560px;height:560px;opacity:.9}
.foot{position:absolute;left:88px;right:88px;bottom:96px;display:flex;justify-content:space-between;align-items:center;font-size:30px;font-weight:700}
.story .foot{bottom:200px}
.arrow{color:var(--cyan)}
.card{border-radius:36px;background:linear-gradient(160deg,#141c33,#0d1426);border:2px solid var(--line);padding:34px 40px}
.pontos{list-style:none;display:flex;flex-direction:column;gap:22px}
.pontos li{display:flex;gap:20px;align-items:flex-start;font-size:36px;line-height:1.3;font-weight:600}
.pontos li::before{content:"";flex:none;width:18px;height:18px;margin-top:14px;border-radius:5px;background:linear-gradient(135deg,var(--cyan),var(--purple))}
.sol{display:flex;align-items:center;gap:22px;padding:28px 34px;border-radius:28px;background:#0a1a26;border:2px solid rgba(34,211,238,.45);font-size:32px;font-weight:600;line-height:1.3}
.sol b{color:var(--cyan)}
.ck{flex:none;width:58px;height:58px;border-radius:50%;background:var(--cyan);display:flex;align-items:center;justify-content:center}
.cols{display:grid;gap:22px}
.col{border-radius:30px;background:linear-gradient(160deg,#141c33,#0d1426);border:2px solid var(--line);padding:30px 32px;display:flex;flex-direction:column;gap:18px}
.col.on{border-color:rgba(34,211,238,.6);background:#0a1a26}
.col h3{font-size:40px;font-weight:800}
.col .pontos li{font-size:30px;font-weight:500;color:#c7cde0}
.col .pontos li::before{width:12px;height:12px;margin-top:12px}
.col .tag{align-self:flex-start;padding:8px 18px;border-radius:999px;font-size:22px;font-weight:700;background:rgba(34,211,238,.15);color:var(--cyan)}
.cta .body{align-items:center;text-align:center}
.cta h2{font-size:84px;letter-spacing:-2px}
.cta .pre{font-size:36px;color:var(--cyan);font-weight:700}
.cta .d{color:#c7cde0;max-width:840px}
.btn{padding:36px 64px;border-radius:999px;font-size:44px;font-weight:800;white-space:nowrap;background:linear-gradient(90deg,var(--blue),var(--purple));box-shadow:0 20px 70px rgba(79,108,245,.5)}
</style></head><body>
<template id="logo"><svg width="52" height="52" viewBox="290 270 500 540"><polygon points="380,270 790,270 695,380 400,380 400,470 290,560 290,380" fill="#22d3ee"/><polygon points="500,480 740,480 640,590 500,590" fill="#4f6cf5"/><polygon points="290,695 500,480 500,590 395,695" fill="#2d3aa0"/><polygon points="290,695 790,695 685,810 290,810" fill="#7c3aed"/></svg></template>
<div id="raiz"></div>
<script>
const LOGO = document.getElementById('logo').innerHTML;
const BARS = '<svg class="bars" viewBox="0 0 620 620"><polygon points="420,0 620,0 620,40 460,180 260,180" fill="#22d3ee"/><polygon points="300,210 620,210 620,250 470,400 140,400" fill="#4f6cf5"/><polygon points="160,430 620,430 620,470 470,620 0,620" fill="#7c3aed"/></svg>';
const KICK = '<svg width="56" height="20"><path d="M0 18h18l8-8h-14zM20 18h18l8-8h-14z" fill="#4f6cf5"/><path d="M28 8h18l8-8h-14z" fill="#22d3ee"/></svg>';
const CK = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#06131a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>';

// Texto vem do JSON: escapa HTML e transforma *trecho* em destaque com gradiente.
function txt(s) {
  const esc = String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return esc.replace(/\*([^*]+)\*/g, '<span class="grad">$1</span>').replace(/\n/g, '<br>');
}
const pontos = l => l?.length ? `<ul class="pontos">${l.map(p => `<li>${txt(p)}</li>`).join('')}</ul>` : '';

const tipos = {
  capa: s => `${BARS}<div class="body">
      ${s.kicker ? `<div class="kicker">${KICK}${txt(s.kicker)}</div>` : ''}
      <h1>${txt(s.titulo)}</h1>
      ${s.subtitulo ? `<p class="d" style="max-width:600px">${txt(s.subtitulo)}</p>` : ''}</div>`,
  item: s => `<div class="body">
      ${s.numero ? `<div class="num grad">${txt(s.numero)}</div>` : ''}
      <h2>${txt(s.titulo)}</h2>
      ${s.texto ? `<p class="d">${txt(s.texto)}</p>` : ''}
      ${s.pontos ? `<div class="card">${pontos(s.pontos)}</div>` : ''}
      ${s.solucao ? `<div class="sol"><div class="ck">${CK}</div><span>${txt(s.solucao)}</span></div>` : ''}</div>`,
  lista: s => tipos.item(s),
  comparativo: s => `<div class="body" style="gap:34px">
      <h2 style="font-size:60px">${txt(s.titulo)}</h2>
      <div class="cols" style="grid-template-columns:repeat(${s.colunas.length},1fr)">
        ${s.colunas.map(c => `<div class="col${c.destaque ? ' on' : ''}">
          ${c.tag ? `<span class="tag">${txt(c.tag)}</span>` : ''}<h3>${txt(c.nome)}</h3>${pontos(c.pontos)}</div>`).join('')}
      </div>
      ${s.solucao ? `<div class="sol"><div class="ck">${CK}</div><span>${txt(s.solucao)}</span></div>` : ''}</div>`,
  cta: s => `<div class="body">
      <div>${LOGO.replace('width="52" height="52"', 'width="140" height="150"')}</div>
      ${s.pre ? `<div class="pre">${txt(s.pre)}</div>` : ''}
      <h2>${txt(s.titulo)}</h2>
      ${s.texto ? `<p class="d">${txt(s.texto)}</p>` : ''}
      ${s.botao ? `<div class="btn">${txt(s.botao)}</div>` : ''}</div>`,
  story: s => tipos.capa(s),
  'story-cta': s => tipos.cta(s),
};

// Chamado pelo render.mjs com o conteudo.json do post.
window.montar = function (dados) {
  const story = dados.formato === 'story';
  document.body.classList.toggle('story', story);
  const total = dados.slides.length;
  const pad = n => String(n).padStart(2, '0');
  document.getElementById('raiz').innerHTML = dados.slides.map((s, i) => {
    const classe = s.tipo.startsWith('story-cta') || s.tipo === 'cta' ? 'cta' : s.tipo;
    const pg = !story && total > 1 ? `<div class="pg">${pad(i + 1)} <span>/ ${pad(total)}</span></div>` : '';
    const ultimo = i === total - 1;
    const rodape = s.rodape ?? (ultimo ? (dados.rodape_cta ?? '') : (!story && i === 0 ? '<span>Arraste para conferir <span class="arrow">→</span></span>' : ''));
    if (!tipos[s.tipo]) throw new Error('Tipo de slide desconhecido: ' + s.tipo);
    return `<section class="s ${classe}"><div class="grid"></div>
      <div class="hdr"><div class="logo">${LOGO}Elevio</div>${pg}</div>
      ${tipos[s.tipo](s)}
      ${rodape ? `<div class="foot">${rodape.includes('<span') ? rodape : txt(rodape)}</div>` : ''}
    </section>`;
  }).join('');
};
</script>
</body></html>
