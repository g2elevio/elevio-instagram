name: Publicar no Instagram

on:
  schedule:
    # De hora em hora (minuto 7, para fugir do pico do GitHub). O horário de cada post vem do calendário.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      teste:
        description: "Só conferir (não publica)"
        type: boolean
        default: true

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Publicar itens aprovados
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
        run: node publicar.mjs ${{ inputs.teste && '--teste' || '' }}
      - name: Salvar o status no calendário
        if: always() && !inputs.teste
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendario
          git diff --cached --quiet || (git commit -m "Calendário: status da publicação" && git push)
